<!--
  Ticky, la mascota "entrada" de nubapay. Pose base (idle), viewBox 240×260, pensada sobre fondo oscuro (#080b11 / #0b0f17).
  Sin texto de fuentes: "ADMIT 1" va a trazos. Brazos de dos tramos (hombro → codo) por delante del cuerpo.
  Animada en src/components/illustrations/ticky.tsx (poses: idle, wave, celebrate, think, sad, scan).
  Colores: lima #c6ff00, tinta #0b0f17, blanco #f5f7fa, azul #0069ff, celeste #6cb0ff, superficie #161b25; confeti #ff5c9a y #ffb020.
-->
